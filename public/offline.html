<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — OFManager</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0d1b3e; color: #eaf0ff; padding: 24px; text-align: center;
      }
      .card { max-width: 380px; }
      img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #b9c4e6; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 12px;
        padding: 12px 20px; background: #1a5fd4; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="OFManager" />
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de joindre OFManager pour le moment. Vérifiez votre connexion, puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
