<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFManager — Vidéo de présentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D1B3E; --navy2:#13245e; --brand:#1A5FD4; --brand-light:#4D9FFF;
    --surface:#F4F7FC; --success:#10B981; --amber:#F59E0B; --rose:#E11D48;
    --ink:#11131a; --muted:#5a6480; --line:#e6ebf4; --card:#ffffff;
    --font:'Inter',system-ui,sans-serif; --display:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #16245a, #070b1c 70%);
    font-family:var(--font); color:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* ---- Player shell ---- */
  #player{position:relative; width:min(96vw,1280px); aspect-ratio:16/9;
    border-radius:18px; overflow:hidden; background:#0a1230;
    box-shadow:0 40px 120px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06);}
  #stage{position:absolute; inset:0}
  .scene{position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .7s ease; display:flex; align-items:center; justify-content:center;}
  .scene.on{opacity:1; pointer-events:auto}
  .scene.on .kb{animation:kb 14s ease forwards}
  @keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.11)}}
  .scene.on .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .scene.on .rise2{animation:rise .8s .12s cubic-bezier(.2,.7,.2,1) both}
  .scene.on .rise3{animation:rise .8s .24s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .scene.on .pop{animation:pop .6s .2s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

  /* ---- Lower-third caption ---- */
  #cap{position:absolute; left:0; right:0; bottom:0; z-index:40; padding:0 0 64px;
    background:linear-gradient(0deg, rgba(5,9,24,.92) 22%, rgba(5,9,24,0)); }
  #cap .inner{max-width:78%; margin:0 auto; padding:0 26px}
  #cap .step{font:600 12px/1 var(--font); letter-spacing:.16em; text-transform:uppercase;
    color:var(--brand-light); margin-bottom:9px; display:flex; align-items:center; gap:9px}
  #cap .step b{background:var(--brand); color:#fff; border-radius:6px; padding:3px 8px; letter-spacing:.04em}
  #cap h2{font:700 27px/1.15 var(--display); letter-spacing:-.01em; margin-bottom:7px}
  #cap p{font:400 15.5px/1.5 var(--font); color:#c7d2ea; max-width:60ch}
  #cap .key,.tg .key{color:#fff; font-weight:600}
  .capwrap{animation:capin .55s ease both}
  @keyframes capin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---- Controls ---- */
  #ctrl{position:absolute; left:0; right:0; bottom:0; z-index:60; padding:10px 16px 12px;
    display:flex; align-items:center; gap:14px; opacity:0; transition:.25s}
  #player:hover #ctrl{opacity:1}
  #bar{flex:1; height:6px; border-radius:6px; background:rgba(255,255,255,.18); position:relative; cursor:pointer}
  #fill{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--brand-light); border-radius:6px}
  #ticks{position:absolute; inset:0; display:flex}
  #ticks span{flex:1; border-right:2px solid rgba(10,18,48,.6)}
  #ticks span:last-child{border:none}
  .cbtn{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15); color:#fff;
    width:38px; height:34px; border-radius:9px; font-size:15px; cursor:pointer; display:grid; place-items:center}
  .cbtn:hover{background:rgba(255,255,255,.22)}
  #time{font:600 12px var(--font); color:#aab6d4; min-width:78px; text-align:center; font-variant-numeric:tabular-nums}
  /* big center play (paused state) */
  #bigplay{position:absolute; inset:0; z-index:70; display:none; place-items:center;
    background:rgba(6,10,26,.45); cursor:pointer}
  #bigplay.show{display:grid}
  #bigplay .b{width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.92); color:var(--navy);
    display:grid; place-items:center; font-size:34px; padding-left:6px; box-shadow:0 20px 50px -10px rgba(0,0,0,.6)}

  /* =================== APP CHROME (recreated UI) =================== */
  .app{position:absolute; inset:0; background:var(--surface); color:var(--ink); overflow:hidden}
  .topnav{height:58px; background:rgba(255,255,255,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:0 22px}
  .topnav .logo{display:flex; align-items:center; gap:9px; font:800 16px var(--display); color:var(--navy)}
  .topnav .logo img{height:26px; width:auto}
  .topnav nav{display:flex; gap:3px; margin-left:6px}
  .topnav nav a{font:500 13.5px var(--font); color:var(--muted); padding:7px 11px; border-radius:8px}
  .topnav nav a.act{background:#eef3fd; color:var(--brand)}
  .topnav .right{margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--muted)}
  .topnav .av{width:32px; height:32px; border-radius:50%; background:var(--navy); color:#fff;
    display:grid; place-items:center; font:700 12px var(--font)}
  .body{padding:24px 30px}
  .h1{font:700 24px var(--display); color:var(--navy); letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:13.5px; margin-top:2px}
  .row{display:flex; gap:16px}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px;
    box-shadow:0 1px 2px rgba(16,24,64,.04)}
  .card.np{padding:0; overflow:hidden}
  .kpi .l{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px}
  .kpi .v{font:700 32px var(--display); color:var(--navy); margin-top:8px; letter-spacing:-.02em}
  .kpi .d{font-size:12px; color:var(--success); margin-top:3px; font-weight:600}
  .ic{width:30px; height:30px; border-radius:9px; background:#eef3fd; color:var(--brand);
    display:grid; place-items:center; font-size:15px}
  .sect{font:700 15px var(--display); color:var(--navy); margin-bottom:14px; display:flex; align-items:center; gap:8px}
  /* table */
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font:600 10.5px var(--font); letter-spacing:.05em; text-transform:uppercase;
    color:#94a0b8; padding:11px 16px; background:#f8fafd; border-bottom:1px solid var(--line)}
  td{padding:11px 16px; border-bottom:1px solid #f1f4f9}
  tr:last-child td{border:none}
  .who{display:flex; align-items:center; gap:10px}
  .ava{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; font:700 11px var(--font)}
  .tag{font:600 11px var(--font); padding:3px 9px; border-radius:20px}
  .tag.g{background:#dcfce7; color:#15803d}.tag.b{background:#dbeafe; color:#1d4ed8}
  .tag.a{background:#fef3c7; color:#a16207}.tag.s{background:#eef1f6; color:#64748b}
  .btn{background:var(--brand); color:#fff; font:600 12.5px var(--font); border-radius:9px; padding:7px 13px; display:inline-flex; gap:6px; align-items:center}
  .btn.o{background:#fff; color:var(--brand); border:1px solid #cfe0fb}
  /* bars chart */
  .bars{display:flex; align-items:flex-end; gap:12px; height:130px; padding-top:8px}
  .bars .b{flex:1; border-radius:8px 8px 0 0; background:linear-gradient(180deg,var(--brand-light),var(--brand)); position:relative}
  .bars .b span{position:absolute; top:-18px; left:0; right:0; text-align:center; font:700 11px var(--font); color:var(--navy)}
  .bars .b small{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10.5px; color:var(--muted)}
  /* donut */
  .donut{width:128px; height:128px; border-radius:50%; display:grid; place-items:center;
    background:conic-gradient(var(--success) 0 86%, #e7ecf4 0); }
  .donut .in{width:92px; height:92px; border-radius:50%; background:#fff; display:grid; place-items:center; text-align:center}
  .donut .in b{font:700 26px var(--display); color:var(--navy)}.donut .in span{font-size:11px;color:var(--muted)}
  /* kanban */
  .kb-cols{display:grid; grid-template-columns:repeat(4,1fr); gap:13px}
  .kcol{background:#eef1f7; border-radius:14px; padding:11px}
  .kcol .ch{display:flex; align-items:center; gap:7px; font:700 12.5px var(--font); margin:2px 4px 11px}
  .kcol .ch .dot{width:9px;height:9px;border-radius:50%}
  .kcol .ch .ct{margin-left:auto; background:#fff; border-radius:20px; padding:1px 8px; font-size:11px; color:var(--muted)}
  .kcard{background:#fff; border-radius:11px; padding:11px; margin-bottom:8px; border:1px solid #eef1f5; box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kcard .t{font:600 12.5px var(--font)}.kcard .m{font-size:11px; color:var(--muted); margin-top:3px}
  .kcard .f{display:flex; align-items:center; gap:6px; margin-top:9px}
  /* calendar */
  .week{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
  .day{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; min-height:230px}
  .day.today{border:2px solid var(--brand)}
  .day .dh{font:600 10.5px var(--font); text-transform:uppercase; letter-spacing:.05em; color:#94a0b8}
  .day .dn{font:700 18px var(--display); color:var(--navy); margin:2px 0 10px}
  .day.today .dn{color:var(--brand)}
  .slot{border-radius:9px; padding:8px; font-size:11px; margin-bottom:7px; border-left:3px solid var(--brand); background:#eef3fd}
  .slot.g{border-color:var(--success); background:#e7f7f0}
  .slot.a{border-color:var(--amber); background:#fef6e7}
  .slot b{display:block; color:var(--navy); font-size:11.5px}
  .slot span{color:var(--muted)}
  /* qualiopi checklist */
  .crit{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #f1f4f9}
  .crit:last-child{border:none}
  .crit .ck{width:24px; height:24px; border-radius:7px; background:var(--success); color:#fff; display:grid; place-items:center; font-size:13px; flex:none}
  .crit .tx b{font:600 13.5px var(--font); color:var(--ink)}
  .crit .tx p{font-size:12px; color:var(--muted); margin-top:1px}
  .crit .pct{margin-left:auto; font:700 13px var(--display); color:var(--success)}
  /* signature pad */
  .sigpad{border:2px dashed #cfe0fb; border-radius:14px; background:#f8fbff; height:150px; display:grid; place-items:center; position:relative; overflow:hidden}
  .sigpad svg{width:60%}
  .sig-path{stroke:var(--navy); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1400; stroke-dashoffset:1400}
  .scene.on .sig-path{animation:draw 2.4s 1.2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  /* doc preview */
  .doc{background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; font-size:11px; color:#475065}
  .doc .dl{height:8px; background:#eef1f7; border-radius:6px; margin:7px 0}
  .doc .dl.s{width:55%}.doc .dl.m{width:80%}
  .doc .stamp{position:absolute; right:18px; bottom:16px; width:84px; opacity:.9; transform:rotate(-9deg)}
  /* white-label gallery */
  .gal{display:grid; grid-template-columns:repeat(5,1fr); gap:11px}
  .skin{border-radius:13px; overflow:hidden; border:1px solid rgba(255,255,255,.12); height:96px; padding:11px; position:relative}
  .skin .sl{display:flex; gap:5px; margin-bottom:9px}
  .skin .sl i{width:22px; height:5px; border-radius:5px; display:block}
  .skin .sc{border-radius:8px; padding:8px; font:700 12px var(--display)}
  .skin .nm{position:absolute; bottom:8px; left:11px; font:600 10.5px var(--font)}
  .pals{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .pals i{width:26px; height:26px; border-radius:50%; display:block; box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  /* panorama complet des fonctionnalités */
  .featgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; width:min(94%,1060px)}
  .featcol{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 13px; text-align:left}
  .featcol h4{font:700 12px var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--brand-light); margin-bottom:11px; display:flex; align-items:center; gap:7px}
  .fchip{display:flex; align-items:center; gap:7px; font:500 12.5px var(--font); color:#dbe4f7; padding:4px 0}
  .fchip .ck{color:var(--success); font-size:11px}
  /* intro / outro */
  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 8%}
  .center.intro{background:radial-gradient(900px 520px at 50% 0%, #1c2f6e, #0a1230 72%)}
  .center .logo-xl{display:flex; align-items:center; gap:14px; margin-bottom:26px}
  .center .logo-xl img{height:62px}
  .center .logo-xl b{font:800 34px var(--display)}
  .center h1{font:800 46px/1.08 var(--display); letter-spacing:-.02em; max-width:18ch}
  .center h1 em{font-style:normal; color:var(--brand-light)}
  .center .tg{font-size:18px; color:#bccbe9; margin-top:18px; max-width:46ch}
  .badges{display:flex; gap:12px; margin-top:30px; flex-wrap:wrap; justify-content:center}
  .pill{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:30px;
    padding:9px 16px; font:600 13px var(--font); display:flex; align-items:center; gap:8px}
  .pill .ck{color:var(--success)}
  .cta{margin-top:30px; background:var(--brand); color:#fff; font:700 16px var(--display); padding:15px 30px; border-radius:13px; display:inline-flex; gap:10px; align-items:center}
  .contact{margin-top:22px; color:#9fb0d6; font-size:14px; display:flex; gap:22px; flex-wrap:wrap; justify-content:center}
  /* problem scene */
  .chaos{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:760px}
  .chaos .t{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px;
    padding:16px 20px; font:600 14px var(--font); color:#cdd8f0; display:flex; align-items:center; gap:10px; opacity:.85}
  .chaos .t .e{font-size:22px}
  .arrow{font-size:30px; color:var(--brand-light); margin:18px 0}
  .float{position:absolute; font-size:13px; color:#8fa2ca; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1); padding:6px 12px; border-radius:20px}
  /* misc */
  .muted{color:var(--muted)} .navy{color:var(--navy)} .succ{color:var(--success)}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted); margin-top:14px}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
  .src{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #f1f4f9; font-size:12.5px}
  .src:last-child{border:none}
  .src .bar2{height:8px; border-radius:6px; background:var(--brand); }
  .progress{height:7px; border-radius:6px; background:#eef1f7; overflow:hidden; margin-top:7px}
  .progress i{display:block; height:100%; background:linear-gradient(90deg,var(--brand-light),var(--brand))}
  @media(max-width:640px){
    #cap .inner{max-width:94%}
    #cap h2{font-size:19px} #cap p{font-size:12.5px}
    .center h1{font-size:30px}
  }
</style>
</head>
<body>
<div id="player">
  <div id="stage"></div>
  <!-- Musique de fond optionnelle : dépose un fichier public/presentation-music.mp3
       pour l'utiliser. Sinon, une nappe d'ambiance libre de droits est synthétisée. -->
  <audio id="bgm" loop preload="auto" src="presentation-music.mp3"></audio>

  <!-- caption -->
  <div id="cap"><div class="inner" id="capinner"></div></div>

  <!-- big play overlay -->
  <div id="bigplay"><div class="b">▶</div></div>

  <!-- controls -->
  <div id="ctrl">
    <button class="cbtn" id="bPlay" title="Lecture/Pause">⏸</button>
    <button class="cbtn" id="bPrev" title="Scène précédente">⏮</button>
    <button class="cbtn" id="bNext" title="Scène suivante">⏭</button>
    <div id="bar"><div id="ticks"></div><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
    <button class="cbtn" id="bMusic" title="Musique de fond">🔊</button>
    <button class="cbtn" id="bFull" title="Plein écran">⛶</button>
  </div>
</div>

<script>
/* ============================================================
   OFManager — moteur de présentation (auto-play)
   Chaque scène = { dur (s), step, title, html, caption }
   ============================================================ */
const LOGO = "ofmanager-logo.png";

const avatar = (txt,bg)=>`<span class="ava" style="background:${bg}">${txt}</span>`;
const appTop = (active)=>`
  <div class="topnav">
    <div class="logo"><span style="color:var(--navy)">OF</span><span style="color:var(--brand)">Manager</span></div>
    <nav>
      ${["Tableau de bord","CRM","Candidats","Sessions","Planning","Qualiopi"].map(n=>
        `<a class="${n===active?'act':''}">${n}</a>`).join("")}
      <a>Plus ▾</a>
    </nav>
    <div class="right"><span>🔍</span><span>🔔</span><span class="av">SC</span></div>
  </div>`;

const SCENES = [
 /* 1 — INTRO */
 { dur:9, essential:true, sdur:8, step:"Présentation", title:"", caption:"", html:`
   <div class="center intro kb">
     <div class="logo-xl rise"><img src="${LOGO}" onerror="this.style.display='none'"></div>
     <h1 class="rise2"><em>OFManager</em><br>le logiciel tout-en-un des organismes de formation</h1>
     <p class="tg rise3">Gérez tout votre organisme, restez conforme <span class="key">Qualiopi</span> sans effort — sur une plateforme <span class="key">100% à votre marque</span>.</p>
     <div class="badges rise3">
       <span class="pill"><span class="ck">✔</span> Conforme Qualiopi</span>
       <span class="pill"><span class="ck">✔</span> BPF automatisé</span>
       <span class="pill"><span class="ck">✔</span> 100% à votre marque</span>
     </div>
   </div>` },

 /* 2 — PROBLÈME */
 { dur:13, step:"Le constat", title:"Trop d'outils, trop de paperasse",
   caption:`Tableurs, e-mails, signatures papier, relances manuelles… Piloter un organisme de formation devient vite <span class="key">ingérable</span> — et risqué à l'audit.`,
   html:`
   <div class="center">
     <div class="chaos rise">
       <div class="t"><span class="e">📊</span> 5 tableurs Excel</div>
       <div class="t"><span class="e">📧</span> Relances à la main</div>
       <div class="t"><span class="e">🖊️</span> Émargements papier</div>
       <div class="t"><span class="e">📁</span> Dossiers éparpillés</div>
       <div class="t"><span class="e">⏰</span> Heures perdues</div>
       <div class="t"><span class="e">⚠️</span> Risque à l'audit Qualiopi</div>
     </div>
     <div class="arrow rise2">↓</div>
     <h1 class="rise2" style="font-size:30px">Et si tout tenait dans <em>un seul</em> outil ?</h1>
   </div>` },

 /* 2b — PANORAMA COMPLET DES FONCTIONNALITÉS */
 { dur:17, essential:true, sdur:13, step:"Tout-en-un", title:"Une seule plateforme, tous vos métiers",
   caption:`OFManager couvre <span class="key">tout le cycle de vie</span> de votre organisme. Voici l'ensemble des modules — nous détaillons ensuite les <span class="key">plus essentiels</span> en images.`,
   html:`<div class="center" style="background:radial-gradient(900px 520px at 50% 8%, #16245a, #0a1230 75%)">
     <h1 class="rise" style="font-size:27px;margin-bottom:20px">De l'acquisition à la conformité, <em>tout y est</em></h1>
     <div class="featgrid rise2">
       <div class="featcol"><h4>🎯 Acquisition</h4>
         <div class="fchip"><span class="ck">✔</span> CRM</div>
         <div class="fchip"><span class="ck">✔</span> Leads multicanal</div>
         <div class="fchip"><span class="ck">✔</span> Scoring IA</div>
         <div class="fchip"><span class="ck">✔</span> Devis & factures</div>
         <div class="fchip"><span class="ck">✔</span> Espace / portail client</div>
         <div class="fchip"><span class="ck">✔</span> Clients pro (B2B)</div>
       </div>
       <div class="featcol"><h4>🗂️ Gestion</h4>
         <div class="fchip"><span class="ck">✔</span> Candidats</div>
         <div class="fchip"><span class="ck">✔</span> Inscriptions</div>

/* ---------- moteur ---------- */
const stage = document.getElementById('stage');
const capinner = document.getElementById('capinner');
const fill = document.getElementById('fill');
const timeEl = document.getElementById('time');
const ticks = document.getElementById('ticks');
const bigplay = document.getElementById('bigplay');
const bPlay = document.getElementById('bPlay');

// Version courte (~90 s) : ?court / ?short / ?90 → ne garde que les scènes
// marquées essential, avec leur durée raccourcie (sdur). Source unique.
const SHORT = /court|short|90/i.test(location.search);
const ACTIVE = SHORT ? SCENES.filter(s=>s.essential) : SCENES;
const durOf = (s)=> (SHORT && s.sdur ? s.sdur : s.dur);

const TOTAL = ACTIVE.reduce((s,x)=>s+durOf(x),0);
let starts=[], acc=0;
ACTIVE.forEach(s=>{ starts.push(acc); acc+=durOf(s); });

// build scene DOM + ticks
ACTIVE.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='scene'; d.dataset.i=i; d.innerHTML=s.html;
  stage.appendChild(d);
  const t=document.createElement('span'); t.style.flex=durOf(s); ticks.appendChild(t);
});
const sceneEls=[...document.querySelectorAll('.scene')];

let cur=-1, t0=performance.now(), elapsed=0, playing=true, raf=null;

function fmt(sec){ sec=Math.max(0,Math.floor(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,'0'); }

function setCaption(i){
  const s=ACTIVE[i];
  if(!s.title && !s.caption){ capinner.innerHTML=''; document.getElementById('cap').style.opacity=0; return; }
  document.getElementById('cap').style.opacity=1;
  capinner.innerHTML=`<div class="capwrap">
    <div class="step"><b>${String(i+1).padStart(2,'0')}/${ACTIVE.length}</b> ${s.step||''}</div>
    ${s.title?`<h2>${s.title}</h2>`:''}
    ${s.caption?`<p>${s.caption}</p>`:''}
  </div>`;
}

function showScene(i){
  if(i===cur) return;
  cur=i;
  sceneEls.forEach((el,j)=>el.classList.toggle('on', j===i));
  // restart CSS animations
  const el=sceneEls[i]; void el.offsetWidth;
  setCaption(i);
}

function tick(now){
  if(playing){ elapsed += (now - t0)/1000; }
  t0=now;
  if(elapsed>=TOTAL){ elapsed=TOTAL; playing=false; pauseUI(true); }
  // find scene
  let i=0; for(let k=0;k<ACTIVE.length;k++){ if(elapsed>=starts[k]) i=k; }
  showScene(i);
  fill.style.width=(elapsed/TOTAL*100)+'%';
  timeEl.textContent=fmt(elapsed)+" / "+fmt(TOTAL);
  raf=requestAnimationFrame(tick);
}

function pauseUI(showBig){
  playing=false; bPlay.textContent='▶'; if(showBig) bigplay.classList.add('show');
}
function play(){ if(elapsed>=TOTAL) elapsed=0; playing=true; bPlay.textContent='⏸'; bigplay.classList.remove('show'); t0=performance.now(); applyMusic(); }
function pause(){ playing=false; bPlay.textContent='▶'; applyMusic(); }
function toggle(){ playing?pause():play(); }
function gotoScene(i){ i=Math.max(0,Math.min(ACTIVE.length-1,i)); elapsed=starts[i]+0.001; t0=performance.now(); showScene(i); }

bPlay.onclick=toggle;
document.getElementById('bPrev').onclick=()=>gotoScene(cur-1);
document.getElementById('bNext').onclick=()=>gotoScene(cur+1);
bigplay.onclick=play;
document.getElementById('bar').onclick=(e)=>{
  const r=e.currentTarget.getBoundingClientRect(); elapsed=(e.clientX-r.left)/r.width*TOTAL; t0=performance.now(); play();
};
document.getElementById('bFull').onclick=()=>{
  const p=document.getElementById('player');
  if(!document.fullscreenElement) p.requestFullscreen?.(); else document.exitFullscreen?.();
};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.key==='ArrowRight') gotoScene(cur+1);
  if(e.key==='ArrowLeft') gotoScene(cur-1);
});

/* ---------- musique de fond ---------- */
const MUSIC_VOL = 0.16;
const bgm = document.getElementById('bgm');
const bMusic = document.getElementById('bMusic');
let musicOn = true, started = false, useFile = false;
let actx = null, master = null, schedTimer = null;

function startSynth(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  actx.resume && actx.resume();
  master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
  const filter = actx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=1300; filter.Q.value=0.5;
  filter.connect(master);
  // un peu d'espace (delay/feedback léger)
  const delay = actx.createDelay(); delay.delayTime.value=0.34;
  const fb = actx.createGain(); fb.gain.value=0.22;
  filter.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(master);
  // progression douce et valorisante : Fmaj7 · Cmaj7 · Dm7 · G7
  const chords = [
    [174.61,220.00,261.63,329.63],
    [130.81,164.81,196.00,246.94],
    [146.83,174.61,220.00,261.63],
    [98.00,123.47,146.83,174.61],
  ];
  const chordDur = 6, atk = 1.7, rel = 2.0;
  function playChord(t, freqs){
    freqs.forEach((f,k)=>{
      const o=actx.createOscillator(); o.type = k===0?'sine':'triangle'; o.frequency.value=f;
      const g=actx.createGain(); g.gain.value=0;
      o.connect(g); g.connect(filter);
      const peak = (k===0?0.26:0.16)/freqs.length*4;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t+atk);
      g.gain.setValueAtTime(peak, t+chordDur-rel);
      g.gain.linearRampToValueAtTime(0.0001, t+chordDur);
      o.start(t); o.stop(t+chordDur+0.05);
    });
  }
  let idx=0, next=actx.currentTime+0.1;
  for(let n=0;n<3;n++){ playChord(next, chords[idx%4]); idx++; next+=chordDur; }
  schedTimer=setInterval(()=>{
    while(next < actx.currentTime + 2){ playChord(next, chords[idx%4]); idx++; next+=chordDur; }
  }, 1000);
}

function startMusic(){
  if(started) return; started=true;
  if(bgm && bgm.readyState>=2 && bgm.currentSrc){      // fichier MP3 fourni
    useFile=true; bgm.volume=0; bgm.play().catch(()=>{ useFile=false; started=false; startSynth(); started=true; });
  } else {                                             // sinon : nappe synthétisée
    startSynth();
  }
}

function applyMusic(){
  const quiet = !(musicOn && playing);
  if(musicOn && playing && !started) startMusic();
  if(started){
    if(useFile){ bgm.volume = quiet?0:MUSIC_VOL; if(quiet) bgm.pause(); else bgm.play().catch(()=>{}); }
    else if(master){ master.gain.linearRampToValueAtTime(quiet?0.0001:MUSIC_VOL, actx.currentTime+0.4); }
  }
  bMusic.textContent = musicOn ? '🔊' : '🔇';
}

bMusic.onclick = ()=>{ musicOn = !musicOn; applyMusic(); };
// l'audio ne peut démarrer qu'après une interaction : on l'amorce au 1er geste.
['pointerdown','keydown','touchstart'].forEach(ev=>
  document.addEventListener(ev, function once(){ applyMusic(); }, {once:true}));

showScene(0);
raf=requestAnimationFrame(tick);
</script>
